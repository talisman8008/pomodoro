<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aesthetic Pomodoro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-container">
  <div class="mode">
    <button id="short-break" type="button">short-break</button>
    <button id="long-break" type="button">long-break</button>
    <button id="custom" type="button">customize</button>
  </div>
  <h1 id="timer">25:00</h1>
  <div class="controls">
    <button id="start" type="button">Start</button>
    <button id="reset" type="button">Reset</button>
  </div>
</div>










<audio id="alarm">
  <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock_short.ogg" type="audio/mpeg">
</audio>

<script src="script.js"></script>
<script src="js/script.js"></script>
</body>
</html>
