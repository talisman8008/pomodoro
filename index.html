<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aesthetic Pomodoro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="timer-container">

  <div class="mode">
    <button id="short-break" type="button">short-break</button>
    <button id="long-break" type="button">long-break</button>
    <button id="custom" type="button">customize</button>
  </div>

  <h1 id="timer">00:00:00</h1>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="Focus" type="button">Focus</button>
      <button id="reset" type="button">Reset</button>

  </div>

</div>




<div id="modal-overlay" class="hidden">
  <div class="modal-content">
    <h3>Custom Session</h3>
    <p>How many minutes would you like to focus?</p>
    <input type="number" id="custom-hours" placeholder="e.g.30" min="0">
    <input type="number" id="custom-minutes" placeholder="e.g. 45" min="0" max="59" >
    <input type="number" id="custom-seconds" placeholder="e.g.30" min="0" max="59">
    <div class="modal-buttons">
      <button id="set-custom" type="button">Set Time</button>
      <button id="close-modal" type="button">Cancel</button>
    </div>
  </div>
</div>


<audio id="alarm">
  <source src="audio/alarm_cukdukuu.wav" type="audio/mpeg">
</audio>


<script src="js/script.js"></script>
</body>
</html>
