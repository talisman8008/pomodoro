<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro | V2</title>
<!--fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--  icons-->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<!--style-->
  <link rel="stylesheet" href="css/style2.css">

</head>
<body data-theme="dark">

<div class="app-background"></div>
<div class="app-overlay"></div>


<main class="dashboard">
  <!-- Top Header -->
  <header class="app-header">
    <div class="logo">
      <span>Pomodoro</span>
    </div>

    <div class="header-controls">
      <div class="auto-flow-wrapper">
        <span class="label">Auto-Flow</span>
        <label class="toggle">
          <input type="checkbox" id="auto-flow">
          <span class="slider"></span>
        </label>
      </div>

      <div class="theme-selector">
        <button id="theme-btn" class="icon-btn" title="Change Theme">
          <ion-icon name="color-palette-outline"></ion-icon>
        </button>
        <div id="theme-dropdown" class="dropdown hidden">
          <div class="dropdown-header">Select Vibe</div>
          <button class="theme-option" data-t="dark">
            <span class="color-dot" style="background:#0a0a0a; border: 1px solid #333;"></span> Dark Minimal
          </button>
          <button class="theme-option" data-t="cyberpunk">
            <span class="color-dot" style="background:linear-gradient(45deg, #00ffcc, #ff00ff);"></span> Cyberpunk
          </button>
          <button class="theme-option" data-t="forestZen">
            <span class="color-dot" style="background:#2e502e;"></span> Forest Zen
          </button>
          <button class="theme-option" data-t="vintage">
            <span class="color-dot" style="background:#d4b483;"></span> Vintage
          </button>
          <button class="theme-option" data-t="nordic">
            <span class="color-dot" style="background:#697d97;"></span> Nordic
          </button>
          <button class="theme-option" data-t="lavender">
            <span class="color-dot" style="background:#c084fc;"></span> Lavender
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Timer Center Area -->
  <section class="timer-section">

    <div class="timer-circle-container">
      <!-- SVG Progress Ring -->
      <svg class="progress-ring" viewBox="0 0 400 400">
        <circle class="ring-track" cx="200" cy="200" r="180"></circle>
        <circle class="ring-progress" id="progress-circle" cx="200" cy="200" r="180"></circle>
      </svg>

      <div class="timer-display">
        <div class="time-label" id="timer-state-label">STAY FOCUSED</div>
        <h1 id="timer">00:25:00</h1>
        <div class="session-info">Session <span id="session-count">1</span>/4</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="reset" class="control-btn outline" title="Reset Timer">
        <ion-icon name="refresh-outline"></ion-icon>
      </button>

      <button id="start" class="control-btn primary play-btn">
        <ion-icon name="play" id="play-icon"></ion-icon>
      </button>

      <button id="skip" class="control-btn outline" title="Skip Session">
        <ion-icon name="play-skip-forward-outline"></ion-icon>
      </button>
    </div>
    <!-- Modes -->
    <div class="modes-pill">
      <button id="work-mode" class="mode-btn active">Focus</button>
      <button id="short-break" class="mode-btn">Short Break</button>
      <button id="long-break" class="mode-btn">Long Break</button>
      <button id="custom-aloo" class="mode-btn">Custom</button>
    </div>

  </section>
</main>

<!--overlaymodal-->
<div id="modal-overlay" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Custom Block</h3>
      <button id="close-modal" class="icon-btn close-btn"><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <p class="modal-subtext">Design your perfect focus session.</p>

    <div class="time-inputs">
      <div class="input-group">
        <input type="number" id="custom-hours" placeholder="00" min="0" max="23">
        <label>HRS</label>
      </div>
      <span class="colon">:</span>
      <div class="input-group">
        <input type="number" id="custom-minutes" placeholder="25" min="0" max="59">
        <label>MIN</label>
      </div>
      <span class="colon">:</span>
      <div class="input-group">
        <input type="number" id="custom-seconds" placeholder="00" min="0" max="59">
        <label>SEC</label>
      </div>
    </div>
    <button id="set-custom" class="modal-primary-btn">Begin Session</button>
  </div>
</div>

<audio id="alarm">
  <source src="audio/alarm_cukdukuu.wav" type="audio/mpeg">
</audio>
<script src="js/js.js"></script>
</body>
</html>
