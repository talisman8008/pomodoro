<div class="main-layout">
  <div class="timer-display-container">
    <h1 id="timer">00:25:00</h1>
    <div class="main-controls">
      <button id="start">Start</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <footer class="bottom-settings">
    <div class="mode-buttons">
      <button id="work-mode">Focus</button>
      <button id="short-break">Short</button>
      <button id="long-break">Long</button>
      <button id="custom">Customize</button>
    </div>
    <button id="theme-toggle">Change Theme</button>
  </footer>
</div>



<div id="modal-overlay" class="hidden">
  <div class="modal-content">
    <h3>Custom Session</h3>
    <p>How many minutes would you like to focus?</p>
    <div class="modal-buttons">
      <button id="set-custom" type="button">Set Time</button>
      <button id="close-modal" type="button">Cancel</button>
    </div>
  </div>
</div>


<audio id="alarm">
