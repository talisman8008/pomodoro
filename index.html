<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aesthetic Pomodoro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Merriweather&family=Quicksand&display=swap" rel="stylesheet">
</head>
<body>


<div class="main-layout">
  <div class="timer-display-container">
    <h1 id="timer">00:25:00</h1>
    <div class="main-controls">
      <button id="start">Start</button>
      <button id="reset">Reset</button>
    </div>
  </div>


  <footer class="bottom-settings">
    <div class="footer-left"></div>
    <div class="mode-buttons">
    <button id="work-mode" class="active">Focus</button>
    <button id="short-break" >Short</button>
    <button id="long-break" >Long</button>
    <button id="custom-aloo" >Customize</button>
  </div>

    <div class="footer-right">
      <div id="thememenu" class="theme-popup hidden">
        <p style="margin-bottom: 10px; font-size: 0.9rem; opacity: 0.8;">Select Vibe</p>
        <div class="theme-options">
          <div class="theme-item">
            <button class="theme-opt" data-t="dark" style="background: #0a0a0a;"></button>
            <span class="theme-label">Dark</span>
          </div>
          <div class="theme-item">
            <button class="theme-opt" data-t="cyberpunk" style="background: #2b0057;"></button>
            <span class="theme-label">Cyber</span>
          </div>
          <div class="theme-item">
            <button class="theme-opt" data-t="forest" style="background: #1b3022;"></button>
            <span class="theme-label">Forest</span>
          </div>
          <div class="theme-item">
            <button class="theme-opt" data-t="cream" style="background: #fdf5e6;"></button>
            <span class="theme-label">Cream</span>
          </div>

          <div class="theme-item">
            <button class="theme-opt" data-t="test2" style="background: #fdf5e6;"></button>
            <span class="theme-label">Cream</span>
          </div>

          <div class="theme-item">
            <button class="theme-opt" data-t="test3" style="background: #fdf5e6;"></button>
            <span class="theme-label">Cream</span>
          </div>

        </div>
      </div>

      <button id="theme-toggle"  type="button">Change Theme</button>
    </div>
  </footer>
</div>

<!--==============================================-->
<!--modal dialog box -->
<!--==============================================-->
<div id="modal-overlay" class="hidden">
  <div class="modal-content">
    <h3>Custom Session</h3>
    <p>How many minutes would you like to focus?</p>
    <div class="input-container">
    <input type="number" id="custom-hours" placeholder="HH" min="0">
    <input type="number" id="custom-minutes" placeholder="MM" min="0" max="59" >
    <input type="number" id="custom-seconds" placeholder="SS" min="0" max="59">
    </div>
    <div class="modal-buttons">
      <button id="set-custom" type="button">Set Time</button>
      <button id="close-modal" type="button">Cancel</button>
    </div>
  </div>
</div>


<audio id="alarm">
  <source src="audio/alarm_cukdukuu.wav" type="audio/mpeg">
</audio>


<script src="js/script.js"></script>
</body>
</html>
